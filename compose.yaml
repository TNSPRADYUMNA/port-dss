services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: port
      POSTGRES_USER: port
      POSTGRES_PASSWORD: port_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U port"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - history:/var/lib/postgresql/data
  redis:
    image: redis:7
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://port:port_local@db:5432/port
      TIMESCALE: "1"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["127.0.0.1:8080:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 25
volumes:
  history:
